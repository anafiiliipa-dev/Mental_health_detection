name: Drift monitoring

# Verification hebdomadaire de derive par rapport au modele "production" sur
# le backend MLflow partage. Ne reentraine ni ne promeut rien -- observation
# et rapport uniquement. Ouvre/met a jour une issue GitHub si une derive
# significative est detectee. Le reentrainement automatique est dans
# retrain.yml.
on:
  schedule:
    - cron: "0 6 * * 1" # tous les lundis a 06h00 UTC, avant retrain.yml (07h00 UTC)
  workflow_dispatch:
    inputs:
      simulate_drift:
        description: "Forcer un echantillon volontairement biaise (derive garantie) au lieu d'un echantillon honnete"
        type: boolean
        default: true

jobs:
  drift-check:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_ARTIFACT_ROOT: ${{ secrets.MLFLOW_ARTIFACT_ROOT }}
      MLFLOW_S3_ENDPOINT_URL: ${{ secrets.MLFLOW_S3_ENDPOINT_URL }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - run: pip install -e ".[api,mlflow,monitoring]" lightgbm

      - name: Run drift check
        id: drift
        env:
          SIMULATE_DRIFT: ${{ github.event_name == 'schedule' && 'true' || (inputs.simulate_drift && 'true' || 'false') }}
        run: |
          if [ "$SIMULATE_DRIFT" = "true" ]; then
            python -m mental_health.monitoring.drift_check --report-path drift_report.html --simulate-drift
          else
            python -m mental_health.monitoring.drift_check --report-path drift_report.html
          fi

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift_report.html
          retention-days: 30

      - name: Open or update the drift alert issue
        if: steps.drift.outputs.dataset_drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N_DRIFTED: ${{ steps.drift.outputs.n_drifted_columns }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label drift-alert --state open --json number --jq '.[0].number // empty')
          BODY="Le job de monitoring hebdomadaire (\`drift_monitoring.yml\`) a detecte une derive significative : **${N_DRIFTED} colonne(s)** en derive.

          Rapport Evidently complet en artifact du run : ${RUN_URL}

          Ceci est un rapport, pas une action automatique -- aucun reentrainement n'est declenche directement par cette alerte (le reentrainement hebdomadaire de \`retrain.yml\` tourne de toute facon, independamment)."
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Derive detectee -- $(date -u +%Y-%m-%d)" \
              --label "drift-alert" \
              --body "$BODY"
          fi
