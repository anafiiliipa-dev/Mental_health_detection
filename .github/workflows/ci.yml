name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-python@v4
      with:
        python-version: 3.12

    - run: pip install -e ".[dev,mlflow,api,rag]"
    - run: ruff check .
    - run: pytest -v