name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: 3.12
    - run: pip install -e ".[dev,mlflow,api,rag,boosted_models]"
    - run: ruff check .
    - run: pytest -v
    - run: docker build -t mental-health-api .

    # Publishes to GCP Artifact Registry (the Cloud Run deployment target,
    # docs/architecture.md), not GHCR — replaces the previous GHCR push.
    # Requires three repo VARIABLES (Settings > Secrets and variables >
    # Actions > Variables — not secret, just config) and one repo SECRET:
    #   GCP_PROJECT_ID  — the GCP project Aamir created for Cloud Run
    #   GCP_REGION      — e.g. europe-west1 (must match the Artifact
    #                      Registry repo's region and the Cloud Run
    #                      service's region)
    #   GCP_AR_REPO     — the Artifact Registry repository name (created
    #                      once via `gcloud artifacts repositories create`,
    #                      see docs/deployment.md)
    #   GCP_SA_KEY (secret) — JSON key for a service account with the
    #                      "Artifact Registry Writer" role on that repo,
    #                      pasted whole as the secret value
    - name: Authenticate to GCP (main only)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up gcloud (main only)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
      uses: google-github-actions/setup-gcloud@v2

    - name: Push image to GCP Artifact Registry (main only)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
      run: |
        gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
        IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/mental-health-api"
        docker tag mental-health-api "$IMAGE:latest"
        docker tag mental-health-api "$IMAGE:${{ github.sha }}"
        docker push "$IMAGE:latest"
        docker push "$IMAGE:${{ github.sha }}"

    # Deploys the image just pushed above to Cloud Run, so the API is
    # reachable at a public HTTPS URL instead of only on localhost. Needs
    # the SAME three repo variables + GCP_SA_KEY secret as the push step
    # above (the service account also needs the "Cloud Run Admin" role, not
    # just "Artifact Registry Writer" -- ask Aamir to grant it if this step
    # fails with a permission error), PLUS the MLflow/S3 secrets that were
    # already added for drift_monitoring.yml / retrain.yml (MLFLOW_TRACKING_URI,
    # MLFLOW_ARTIFACT_ROOT, MLFLOW_S3_ENDPOINT_URL, AWS_ENDPOINT_URL_S3,
    # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION) -- the container
    # never bakes these in (see the Dockerfile comment), it reads them from
    # the environment at startup, exactly like running it locally with a
    # .env file.
    - name: Deploy to Cloud Run (main only)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
      run: |
        IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/mental-health-api:${{ github.sha }}"
        gcloud run deploy mental-health-api \
          --image "$IMAGE" \
          --region "${{ vars.GCP_REGION }}" \
          --platform managed \
          --allow-unauthenticated \
          --port 8000 \
          --memory 2Gi \
          --set-env-vars "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" \
          --set-env-vars "MLFLOW_ARTIFACT_ROOT=${{ secrets.MLFLOW_ARTIFACT_ROOT }}" \
          --set-env-vars "MLFLOW_S3_ENDPOINT_URL=${{ secrets.MLFLOW_S3_ENDPOINT_URL }}" \
          --set-env-vars "AWS_ENDPOINT_URL_S3=${{ secrets.AWS_ENDPOINT_URL_S3 }}" \
          --set-env-vars "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" \
          --set-env-vars "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
          --set-env-vars "AWS_REGION=${{ secrets.AWS_REGION }}"

    - name: Show the deployed API URL (main only)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
      run: |
        gcloud run services describe mental-health-api --region "${{ vars.GCP_REGION }}" --format="value(status.url)"
