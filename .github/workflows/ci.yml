name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: 3.12
    - run: pip install -e ".[dev,mlflow,api,rag,boosted_models]"
    - run: ruff check .
    - run: pytest -v
    - run: docker build -t mental-health-api .

    # Publie sur GCP Artifact Registry (la cible de déploiement Cloud Run,
    # voir docs/architecture.md), plus sur GHCR — remplace l'ancien push GHCR.
    # Nécessite trois VARIABLES du repo (Settings > Secrets and variables >
    # Actions > Variables — pas secret, juste de la config) et un SECRET :
    #   GCP_PROJECT_ID  — le projet GCP créé par Aamir pour Cloud Run
    #   GCP_REGION      — ex. europe-west1 (doit correspondre à la région
    #                      du dépôt Artifact Registry et du service Cloud Run)
    #   GCP_AR_REPO     — le nom du dépôt Artifact Registry (créé une fois
    #                      via `gcloud artifacts repositories create`,
    #                      voir docs/deployment.md)
    #   GCP_SA_KEY (secret) — clé JSON d'un compte de service avec le rôle
    #                      "Artifact Registry Writer" sur ce dépôt, collée
    #                      entièrement comme valeur du secret
    - name: Authenticate to GCP (main only)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up gcloud (main only)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
      uses: google-github-actions/setup-gcloud@v2

    - name: Push image to GCP Artifact Registry (main only)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
      run: |
        gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
        IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/mental-health-api"
        docker tag mental-health-api "$IMAGE:latest"
        docker tag mental-health-api "$IMAGE:${{ github.sha }}"
        docker push "$IMAGE:latest"
        docker push "$IMAGE:${{ github.sha }}"

    # Déploie l'image qui vient d'être publiée ci-dessus sur Cloud Run, pour
    # que l'API soit accessible via une URL HTTPS publique et pas seulement
    # en local. Nécessite les MÊMES trois variables du repo + le secret
    # GCP_SA_KEY que l'étape de push ci-dessus (le compte de service a aussi
    # besoin du rôle "Cloud Run Admin", pas seulement "Artifact Registry
    # Writer" — demander à Aamir de l'ajouter si cette étape échoue avec une
    # erreur de permission), PLUS les secrets MLflow/S3 (MLFLOW_TRACKING_URI,
    # MLFLOW_ARTIFACT_ROOT, MLFLOW_S3_ENDPOINT_URL, AWS_ENDPOINT_URL_S3,
    # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION) — le conteneur ne
    # les intègre jamais dans l'image (voir le commentaire du Dockerfile), il
    # les lit depuis l'environnement au démarrage, exactement comme en local
    # avec un fichier .env.
    #
    # --cpu 2 --cpu-boost : par défaut, Cloud Run restreint le CPU pendant le
    # démarrage du conteneur (il ne libère le CPU complet qu'une fois que le
    # service répond aux requêtes). Comme l'image installe torch/transformers
    # (voir le commentaire du Dockerfile), l'import de ces librairies au
    # démarrage peut dépasser le délai imparti sans ce boost — c'est ce qui
    # provoquait l'erreur "container failed to start and listen on the port".
    - name: Deploy to Cloud Run (main only)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
      run: |
        IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/mental-health-api:${{ github.sha }}"
        gcloud run deploy mental-health-api \
          --image "$IMAGE" \
          --region "${{ vars.GCP_REGION }}" \
          --platform managed \
          --allow-unauthenticated \
          --port 8000 \
          --memory 2Gi \
          --cpu 2 \
          --cpu-boost \
          --set-env-vars "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" \
          --set-env-vars "MLFLOW_ARTIFACT_ROOT=${{ secrets.MLFLOW_ARTIFACT_ROOT }}" \
          --set-env-vars "MLFLOW_S3_ENDPOINT_URL=${{ secrets.MLFLOW_S3_ENDPOINT_URL }}" \
          --set-env-vars "AWS_ENDPOINT_URL_S3=${{ secrets.AWS_ENDPOINT_URL_S3 }}" \
          --set-env-vars "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" \
          --set-env-vars "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
          --set-env-vars "AWS_REGION=${{ secrets.AWS_REGION }}"

    - name: Show the deployed API URL (main only)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
      run: |
        gcloud run services describe mental-health-api --region "${{ vars.GCP_REGION }}" --format="value(status.url)"