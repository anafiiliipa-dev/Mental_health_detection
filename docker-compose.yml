# Convenience wrapper around `docker build` + `docker run` for local dev.
# Mounts the real mlflow.db/mlruns from the host so the containerized API
# serves whatever model is currently aliased "production" on this machine
# — no separate model bundled into the image.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
