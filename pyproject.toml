# ============================================================
# Mental Health Intelligence — Project metadata & dependencies
# ------------------------------------------------------------
# Single source of truth for dependencies. The legacy files
# requirements.txt and requirements_streamlit.txt are kept as
# convenience shortcuts that mirror these extras.
#
# Use:
#   pip install -e .                # core only
#   pip install -e ".[streamlit]"   # core + dashboard
#   pip install -e ".[dev]"         # core + tests + linters
#   pip install -e ".[all]"         # everything (incl. transformers)
# ============================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mental-health-intelligence"
version = "0.3.0"
description = "Clinical-grade NLP triage with Nested-CV-validated ML and grounded LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ana Gouveia" },
]
keywords = [
    "nlp",
    "mental-health",
    "clinical",
    "rag",
    "streamlit",
    "scikit-learn",
    "langchain",
    "faiss",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

# ---- Core runtime: classical ML + RAG + LLM client ----
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "python-dotenv>=1.0",
    "openai>=1.14",
    "langchain>=0.2",
    "langchain-text-splitters>=0.2",
    "langchain-community>=0.2",
    "langchain-huggingface>=0.0.3",
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.7",
]

[project.optional-dependencies]
# ---- Dashboard (Streamlit + plotting) ----
streamlit = [
    "streamlit>=1.32",
    "streamlit-option-menu>=0.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

# ---- Transformer notebooks (heavy; GPU recommended) ----
transformers = [
    "torch>=2.0",
    "transformers>=4.38",
    "datasets>=2.16",
    "accelerate>=0.27",
]

# ---- NLP preprocessing helpers used by notebook 01 ----
nlp = [
    "nltk>=3.8",
    "spacy>=3.7",
    "tqdm>=4.66",
]

# ---- Development: tests, linting, hooks ----
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "nbstripout>=0.7",
    "pre-commit>=3.7",
]

# ---- MLflow tracking/registry (training pipeline, Phase 3+) ----
mlflow = [
    "mlflow>=2.14",
]

# ---- Everything (dashboard + heavy notebooks + dev tooling) ----
all = [
    "mental-health-intelligence[streamlit,transformers,nlp,dev,mlflow]",
]

[project.urls]
Homepage      = "https://github.com/anafiiliipa-dev/Mental_health_detection"
Repository    = "https://github.com/anafiiliipa-dev/Mental_health_detection"
Issues        = "https://github.com/anafiiliipa-dev/Mental_health_detection/issues"
Documentation = "https://github.com/anafiiliipa-dev/Mental_health_detection/blob/main/docs/architecture.md"

# ---- Console entry point so users can launch the dashboard
#      with a single command after install ----
[project.scripts]
mental-health-dashboard = "mental_health.app.app:main"

# ============================================================
# setuptools — package discovery
# ============================================================
[tool.setuptools.packages.find]
where = ["src"]
include = ["mental_health*"]

# ============================================================
# pytest
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--color=yes",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ============================================================
# coverage
# ============================================================
[tool.coverage.run]
source = ["src/mental_health"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# ============================================================
# ruff — fast linter + formatter (replaces black/isort/flake8)
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", "faiss_index", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line too long (formatter handles it)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM", "N", "F841", "RUF059"]        # tests legitimately use patterns flagged in src code
"src/mental_health/app/app.py" = ["E402", "N806", "B905", "SIM117"]  # sys.path tweak; UPPER_CASE locals are private constants
"src/mental_health/models/services.py" = ["N806"]      # _UPPER_CASE locals are private constants by convention
"src/mental_health/train/benchmark.py" = ["N803", "N806"]  # X_train/X_dev is the standard sklearn matrix convention
"src/mental_health/train/train.py" = ["N806"]          # X_train/X_test is the standard sklearn matrix convention
"notebooks/*" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
