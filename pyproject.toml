# ============================================================
# Mental Health Intelligence — Project metadata & dependencies
# ------------------------------------------------------------
# Replaces the legacy requirements.txt + requirements_streamlit.txt.
# Use:
#   pip install -e .              # core only
#   pip install -e ".[streamlit]" # core + dashboard
#   pip install -e ".[dev]"       # core + tests + linters
#   pip install -e ".[all]"       # everything (incl. transformers)
# ============================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mental-health-intelligence"
version = "0.2.0"
description = "Clinical-grade NLP triage with Nested-CV-validated ML and grounded LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ana Gouveia" },
    { name = "Nicolas Moignard" },
]
keywords = ["nlp", "mental-health", "clinical", "rag", "streamlit", "scikit-learn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ---- Core runtime: classical ML + RAG + LLM client ----
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "python-dotenv>=1.0",
    "openai>=1.14",
    "langchain>=0.2",
    "langchain-text-splitters>=0.2",
    "langchain-community>=0.2",
    "langchain-huggingface>=0.0.3",
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.7",
]

[project.optional-dependencies]

# ---- Dashboard (Streamlit + plotting) ----
streamlit = [
    "streamlit>=1.32",
    "streamlit-option-menu>=0.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

# ---- Transformer notebooks (heavy; GPU recommended) ----
transformers = [
    "torch>=2.0",
    "transformers>=4.38",
    "datasets>=2.16",
    "accelerate>=0.27",
]

# ---- NLP preprocessing helpers used by notebook 01 ----
nlp = [
    "nltk>=3.8",
    "spacy>=3.7",
    "tqdm>=4.66",
]

# ---- Development: tests, linting, hooks ----
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "nbstripout>=0.7",
    "pre-commit>=3.7",
]

# ---- Everything (dashboard + heavy notebooks + dev tooling) ----
all = [
    "mental-health-intelligence[streamlit,transformers,nlp,dev]",
]

[project.urls]
Homepage   = "https://github.com/anafiiliipa-dev/Mental_health_detection"
Repository = "https://github.com/anafiiliipa-dev/Mental_health_detection"
Issues     = "https://github.com/anafiiliipa-dev/Mental_health_detection/issues"

# ---- Console entry point so users can launch the dashboard
#      with a single command after install ----
[project.scripts]
mental-health-dashboard = "mental_health.app.app:main"


# ============================================================
# setuptools — package discovery
# ============================================================
[tool.setuptools.packages.find]
where = ["src"]
include = ["mental_health*"]


# ============================================================
# pytest
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]


# ============================================================
# ruff — fast linter + formatter (replaces black/isort/flake8)
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", "faiss_index", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long (formatter handles it)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]   # tests legitimately use patterns flagged in src code
"src/mental_health/app/app.py" = ["E402"]  # sys.path tweak before imports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
